<!DOCTYPE html>
<html>
<head>
    <title>Disaster Management Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #0b3c5d;
            --secondary: #1d70a2;
            --accent: #c0392b;
            --bg-light: #f4f6f8;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-side { font-size: 20px; font-weight: 600; }

        .right-side { display: flex; align-items: center; gap: 20px; }

        .right-side button {
            background-color: var(--accent);
            color: var(--white);
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .content { display: flex; min-height: calc(100vh - 70px); }

        .sidebar {
            width: 220px;
            background-color: var(--secondary);
            padding: 20px 0;
            color: var(--white);
        }

        .sidebar h3 {
            margin: 0;
            padding: 12px 20px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .sidebar h3:hover { background-color: var(--accent); }

        .data { padding: 24px; width: 100%; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--white);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th { background-color: var(--primary); color: var(--white); }

        .pdf-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .pdf-btn:hover { background-color: #c0392b; }
    </style>
</head>

<body>
    <header>
        <div class="left-side">Emergency Response System</div>
        <div class="right-side">
            <button onclick="logout()">Logout</button>
            <i class="fas fa-bell"></i>
        </div>
    </header>

    <div class="content">
        <div class="sidebar">
            <h3 onclick="location.href='Dashboard.html'">Dashboard</h3>
            <h3 onclick="location.href='Reports.html'">Reports</h3>
            <h3 onclick="location.href='Users.html'">Users</h3>
            <h3 onclick="location.href='Logs.html'">Logs</h3>
            <h3 onclick="location.href='Setting.html'">Settings</h3>
        </div>

        <div class="data">
            <h1>📋 Incident Logs</h1>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Contact Number</th>
                        <th>Location</th>
                        <th>Time</th>
                        <th>Get Report</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr><td colspan="5" style="text-align:center;">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") !== "true") {
                window.location.href = "login.html";
            } else {
                fetchLogs();
            }
        };

        function logout() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "login.html";
        }

        async function fetchLogs() {
            try {
                const response = await fetch("http://localhost:5000/get-reports");
                const data = await response.json();
                const tbody = document.getElementById("logsTableBody");
                tbody.innerHTML = "";

                data.forEach(log => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${log.fullname}</td>
                        <td>${log.mobile}</td>
                        <td>${log.location}</td>
                        <td>${log.datetime}</td>
                        <td>
                            <button class="pdf-btn" onclick='generatePDF(${JSON.stringify(log)})'>
                                <i class="fas fa-file-pdf"></i> PDF Report
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("logsTableBody").innerHTML = "<tr><td colspan='5' style='text-align:center;'>Error loading data.</td></tr>";
            }
        }

        // PDF जनरेट करण्याचे मुख्य फंक्शन
        function generatePDF(log) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // हेडर डिझाइन
            doc.setFillColor(11, 60, 93); // Primary Color
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.text("INCIDENT REPORT", 105, 20, { align: "center" });
            
            doc.setFontSize(10);
            doc.text("Emergency Response System - Disaster Management", 105, 30, { align: "center" });

            // रिपोर्ट तपशील
            doc.setTextColor(44, 62, 80);
            doc.setFontSize(14);
            doc.text(`Report Details for: ${log.fullname}`, 14, 55);

            // टेबल फॉरमॅटमध्ये माहिती
            doc.autoTable({
                startY: 65,
                theme: 'grid',
                headStyles: { fillColor: [29, 112, 162] }, // Secondary Color
                body: [
                    ["Full Name", log.fullname],
                    ["Contact Number", log.mobile],
                    ["Disaster Type", log.disasterType],
                    ["Location", log.location],
                    ["Date & Time", log.datetime],
                    ["Description", log.description || "No description provided"]
                ],
                styles: { fontSize: 11, cellPadding: 5 }
            });

            // फुटर
            const pageHeight = doc.internal.pageSize.height;
            doc.setFontSize(9);
            doc.setTextColor(150);
            doc.text("Generated by Admin System | Confirmed Incident Log", 105, pageHeight - 10, { align: "center" });

            // फाईल सेव्ह करणे
            doc.save(`Incident_Report_${log.fullname}.pdf`);
        }
    </script>
</body>
</html>
