<!DOCTYPE html>
<html>
<head>
    <title>Disaster Management Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --primary: #0b3c5d;
            --secondary: #1d70a2;
            --accent: #c0392b;
            --bg-light: #f4f6f8;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Header */
        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-side {
            font-size: 20px;
            font-weight: 600;
        }

        .right-side {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .right-side button {
            background-color: var(--accent);
            color: var(--white);
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .right-side i {
            font-size: 20px;
            cursor: pointer;
        }

        /* DASHBOARD CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.35s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .up { color: #22c55e; font-size: 14px; }
        .down { color: #ef4444; font-size: 14px; }

        /* Layout */
        .content {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: var(--secondary);
            padding: 20px 0;
            color: var(--white);
        }

        .sidebar h3 {
            margin: 0;
            padding: 12px 20px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .sidebar h3:hover {
            background-color: var(--accent);
            border-radius: 7px;
            width: 100%;
        }

        /* Main Data Area */
        .data {
            padding: 24px;
            width: 100%;
        }

        .data h1 {
            margin-bottom: 20px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--white);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
        }
    </style>
</head>

<body>
    <header>
        <div class="left-side">Emergency Response System</div>
        <div class="right-side">
            <button onclick="logout()">Logout</button>
            <i class="fas fa-bell"></i>
        </div>
    </header>

    <div class="content">
        <div class="sidebar">
            <h3 onclick="location.href='Dashboard.html'">Dashboard</h3>
            <h3 onclick="location.href='Reports.html'">Reports</h3>
            <h3 onclick="location.href='Users.html'">Users</h3>
            <h3 onclick="location.href='Setting.html'">Settings</h3>
            <h3 onclick="location.href='Logs.html'">Logs</h3>
        </div>

        <div class="data">
            <h1>Dashboard Overview</h1>
            <div class="cards">
                <div class="card">
                    <h3>🚨 Alerts (Today)</h3>
                    <h1 id="today-alerts-count">0</h1>
                    <span id="alert-status" class="down">Live Updates</span>
                </div>

                <div class="card">
                    <h3>📄 Reports</h3>
                    <h1 id="total-reports-count">0</h1>
                    <span class="up">↑ Real-time</span>
                </div>

                <div class="card">
                    <h3>👥 Users</h3>
                    <h1 id="total-users">0</h1>
                    <span class="up">↑ Total registered</span>
                </div>

                <div class="card">
                    <h3>📍 Affected area</h3>
                    <h1 id="total-locations-count">0</h1>
                    <span class="up" style="color: blue;">Unique regions</span>
                </div>
            </div>

            <h4>Recent Activities</h4>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Contact Number</th>
                        <th>Location</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="recent-activities-body">
                    <tr><td colspan="4" style="text-align:center;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // १. लॉगिन चेक आणि सर्व डेटा फेच करणे
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") !== "true") {
                window.location.href = "login.html";
            } else {
                fetchDashboardData();
            }
        };

        function logout() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "login.html";
        }

        // २. मुख्य डेटा फेचिंग फंक्शन
        async function fetchDashboardData() {
            try {
                // REPORTS डेटासाठी API कॉल
                const reportRes = await fetch("http://localhost:5000/get-reports");
                const reports = await reportRes.json();

                // कार्ड्स अपडेट करा
                // A. Total Reports
                document.getElementById("total-reports-count").innerText = reports.length;

                // B. Today's Alerts
                const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
                const todayAlerts = reports.filter(r => r.datetime.startsWith(today));
                document.getElementById("today-alerts-count").innerText = todayAlerts.length;

                const statusSpan = document.getElementById("alert-status");
                if (todayAlerts.length > 0) {
                    statusSpan.innerText = "⚠️ Attention Required";
                    statusSpan.style.color = "red";
                } else {
                    statusSpan.innerText = "✅ All Clear";
                    statusSpan.style.color = "green";
                }

                // C. Affected Areas (Unique Locations)
                const locations = [...new Set(reports.map(r => r.location.trim()))];
                document.getElementById("total-locations-count").innerText = locations.length;

                // D. Recent Activities Table (Latest 5)
                const tbody = document.getElementById("recent-activities-body");
                tbody.innerHTML = "";
                const latestReports = reports.slice(0, 5);

                if (latestReports.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No reports found</td></tr>";
                } else {
                    latestReports.forEach(report => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${report.fullname}</td>
                                <td>${report.mobile}</td>
                                <td>${report.location}</td>
                                <td>${report.datetime}</td>
                            </tr>
                        `;
                    });
                }

                // USERS डेटासाठी API कॉल
                const userRes = await fetch("http://localhost:5000/get-users");
                const users = await userRes.json();
                document.getElementById("total-users").innerText = users.length;

            } catch (error) {
                console.error("Error loading dashboard data:", error);
            }
        }
    </script>
</body>
</html>
